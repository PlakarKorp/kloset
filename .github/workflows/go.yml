name: Go

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The kortex coverage upload authenticates with the job's OIDC token.
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Build
      run: go build -v ./...

    # Produce a coverage profile and a JUnit XML in one run. continue-on-error
    # + explicit exit keeps the upload steps reachable on test failure — that is
    # exactly when the test results are most useful; a later step re-surfaces
    # the failure.
    - name: Test
      id: gotest
      continue-on-error: true
      run: |
        set -o pipefail
        set +e # disable errexit
        go test -v -coverprofile=coverage.out -covermode=atomic -timeout 1m -json ./... \
            | go tool go-junit-report -parser gojson -set-exit-code > junit.xml
        status=$?
        echo "test_exit=$status" >> "$GITHUB_OUTPUT"
        exit $status

    # kortex gets the same reports, sent by the uploader it serves (a public
    # repository cannot use its action) with the job's OIDC token: no secret.
    # A pull request from a fork gets no token and uploads nothing. Failing
    # here is a warning, never a failed build.
    - name: Upload coverage and test results to kortex
      if: ${{ !cancelled() }}
      run: |
        if ! curl -fsSL --retry 3 https://kortex.plakar.io/dl/kortex-linux-amd64 -o "$RUNNER_TEMP/kortex"; then
          echo "::warning title=kortex coverage upload::could not fetch the uploader"
          exit 0
        fi
        chmod +x "$RUNNER_TEMP/kortex"
        "$RUNNER_TEMP/kortex" coverage upload --url https://kortex.plakar.io coverage.out junit.xml

    - name: Fail if tests failed
      if: ${{ steps.gotest.outputs.test_exit != '0' }}
      run: exit 1
